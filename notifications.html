<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications - BH Skills Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f1f5f9;
    color:#1e293b;
}

header{
    background:#0f172a;
    color:white;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.back{
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:9px 14px;
    border-radius:7px;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.page-title{
    margin-bottom:20px;
}

.page-title h1{
    font-size:28px;
    margin-bottom:6px;
}

.page-title p{
    color:#64748b;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.card-header h2{
    font-size:19px;
}

.clear-btn{
    border:none;
    background:#fee2e2;
    color:#b91c1c;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.notification{
    display:flex;
    gap:14px;
    padding:15px 5px;
    border-bottom:1px solid #e2e8f0;
}

.notification:last-child{
    border-bottom:none;
}

.icon{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#dbeafe;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
}

.notification h3{
    font-size:16px;
    margin-bottom:5px;
}

.notification p{
    color:#64748b;
    line-height:1.5;
}

.time{
    font-size:12px;
    color:#94a3b8;
    margin-top:5px;
}

.empty{
    text-align:center;
    padding:30px 10px;
    color:#94a3b8;
}

.activity{
    display:flex;
    gap:13px;
    padding:14px 5px;
    border-bottom:1px solid #e2e8f0;
}

.activity:last-child{
    border-bottom:none;
}

.activity-icon{
    font-size:20px;
}

.activity p{
    line-height:1.5;
}

.activity-time{
    color:#94a3b8;
    font-size:12px;
    margin-top:4px;
}

.loading{
    text-align:center;
    padding:20px;
    color:#64748b;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:8px;
}

footer{
    text-align:center;
    color:#64748b;
    padding:25px;
}

@media(max-width:600px){

    header{
        gap:10px;
    }

    .logo{
        font-size:18px;
    }

    .back{
        font-size:13px;
    }

    .page-title h1{
        font-size:24px;
    }

    .card{
        padding:16px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        BH Skills Hub
    </div>

    <a href="dashboard.html" class="back">
        ← Dashboard
    </a>

</header>


<div class="container">

    <div class="page-title">

        <h1>
            🔔 Notifications
        </h1>

        <p>
            Stay updated with your learning and projects.
        </p>

    </div>


    <!-- NOTIFICATIONS -->

    <div class="card">

        <div class="card-header">

            <h2>
                🔔 Notifications
            </h2>

            <button
                class="clear-btn"
                onclick="clearNotifications()">

                Clear All

            </button>

        </div>


        <div id="notifications">

            <div class="loading">
                Loading notifications...
            </div>

        </div>

    </div>


    <!-- RECENT ACTIVITY -->

    <div class="card">

        <div class="card-header">

            <h2>
                🕒 Recent Activity
            </h2>

        </div>


        <div id="activity">

            <div class="loading">
                Loading activity...
            </div>

        </div>

    </div>

</div>


<footer>
    © 2026 BH Skills Hub
</footer>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    orderBy,
    limit,
    getDocs,
    writeBatch,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyB589OXINetS1PMr2i8SSU6YRZ-khF3nj8",

    authDomain:
    "bh-skills-hub.firebaseapp.com",

    projectId:
    "bh-skills-hub",

    storageBucket:
    "bh-skills-hub.firebasestorage.app",

    messagingSenderId:
    "503359590632",

    appId:
    "1:503359590632:web:5b81f57e402addaf2bb95d6"
};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =========================
   GLOBAL
========================= */

let currentUser = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;
        }

        currentUser = user;

        await loadNotifications();

        await loadActivity();

    }
);


/* =========================
   NOTIFICATIONS
========================= */

async function loadNotifications(){

    const box =
        document.getElementById(
            "notifications"
        );

    try{

        const ref =
            collection(
                db,
                "users",
                currentUser.uid,
                "notifications"
            );


        const q =
            query(
                ref,
                orderBy(
                    "createdAt",
                    "desc"
                ),
                limit(30)
            );


        const snapshot =
            await getDocs(q);


        if(snapshot.empty){

            box.innerHTML = `
                <div class="empty">
                    🔔<br><br>
                    No notifications yet.
                </div>
            `;

            return;
        }


        box.innerHTML = "";


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "notification";


                div.innerHTML = `

                    <div class="icon">
                        ${data.icon || "🔔"}
                    </div>

                    <div>

                        <h3>
                            ${escapeHTML(
                                data.title ||
                                "Notification"
                            )}
                        </h3>

                        <p>
                            ${escapeHTML(
                                data.message ||
                                ""
                            )}
                        </p>

                        <div class="time">
                            ${formatTime(
                                data.createdAt
                            )}
                        </div>

                    </div>
                `;


                box.appendChild(div);

            }
        );

    }
    catch(error){

        console.error(error);

        box.innerHTML = `
            <div class="error">
                Failed to load notifications.
            </div>
        `;
    }
}


/* =========================
   ACTIVITY
========================= */

async function loadActivity(){

    const box =
        document.getElementById(
            "activity"
        );


    try{

        /*
        For now we use notifications
        as activity source.
        */

        const ref =
            collection(
                db,
                "users",
                currentUser.uid,
                "notifications"
            );


        const q =
            query(
                ref,
                orderBy(
                    "createdAt",
                    "desc"
                ),
                limit(15)
            );


        const snapshot =
            await getDocs(q);


        if(snapshot.empty){

            box.innerHTML = `
                <div class="empty">
                    🕒<br><br>
                    No recent activity.
                </div>
            `;

            return;
        }


        box.innerHTML = "";


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "activity";


                div.innerHTML = `

                    <div class="activity-icon">
                        ${data.icon || "📌"}
                    </div>

                    <div>

                        <p>
                            <strong>
                                ${escapeHTML(
                                    data.title ||
                                    "Activity"
                                )}
                            </strong>

                            ${
                                data.message
                                ? " — " +
                                escapeHTML(
                                    data.message
                                )
                                : ""
                            }
                        </p>

                        <div class="activity-time">
                            ${formatTime(
                                data.createdAt
                            )}
                        </div>

                    </div>
                `;


                box.appendChild(div);

            }
        );

    }
    catch(error){

        console.error(error);

        box.innerHTML = `
            <div class="error">
                Failed to load activity.
            </div>
        `;
    }
}


/* =========================
   CLEAR NOTIFICATIONS
========================= */

window.clearNotifications =
async function(){

    if(!currentUser){

        return;
    }


    const confirmClear =
        confirm(
            "Clear all notifications?"
        );


    if(!confirmClear){

        return;
    }


    try{

        const ref =
            collection(
                db,
                "users",
                currentUser.uid,
                "notifications"
            );


        const snapshot =
            await getDocs(ref);


        if(snapshot.empty){

            return;
        }


        const batch =
            writeBatch(db);


        snapshot.forEach(
            item => {

                batch.delete(
                    item.ref
                );

            }
        );


        await batch.commit();


        await loadNotifications();

        await loadActivity();

    }
    catch(error){

        console.error(error);

        alert(
            "Failed to clear notifications."
        );
    }
};


/* =========================
   HELPERS
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatTime(timestamp){

    if(!timestamp){

        return "Just now";
    }


    try{

        const date =
            timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);


        return date.toLocaleString();

    }
    catch(e){

        return "Recently";
    }
}

</script>

</body>
</html>
