<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - BH Skills Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px 25px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .signup-btn:hover {
            background: #1d4ed8;
        }

        .signup-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #667085;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667085;
            text-decoration: none;
            font-size: 14px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        BH <span>Skills Hub</span>
    </div>

    <p class="subtitle">
        Create your account
    </p>

    <form id="signupForm">

        <!-- FULL NAME -->
        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

        </div>

        <!-- EMAIL -->
        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>

        <!-- PASSWORD -->
        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                autocomplete="new-password"
                required
            >

        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="6"
                autocomplete="new-password"
                required
            >

        </div>

        <!-- BUTTON -->
        <button
            type="submit"
            class="signup-btn"
            id="signupBtn"
        >
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login">
        Already have an account?

        <a href="login.html">
            Login
        </a>
    </div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>


<script type="module">

    // =========================================
    // FIREBASE APP
    // =========================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    // =========================================
    // FIREBASE AUTH
    // =========================================

    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    // =========================================
    // FIRESTORE
    // =========================================

    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    // =========================================
    // FIREBASE CONFIG
    // =========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyB589OXINetS1PMr2i8SSU6YRZ-khF3nj8",

        authDomain:
            "bh-skills-hub.firebaseapp.com",

        projectId:
            "bh-skills-hub",

        storageBucket:
            "bh-skills-hub.firebasestorage.app",

        messagingSenderId:
            "503359590632",

        appId:
            "1:503359590632:web:5b81f57e402addaf2bb95d6"
    };


    // =========================================
    // INITIALIZE FIREBASE
    // =========================================

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    // =========================================
    // ELEMENTS
    // =========================================

    const form =
        document.getElementById("signupForm");

    const message =
        document.getElementById("message");

    const signupBtn =
        document.getElementById("signupBtn");


    // =========================================
    // SIGN UP
    // =========================================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            // =====================================
            // GET FORM DATA
            // =====================================

            const name =
                document
                .getElementById("name")
                .value
                .trim();

            const email =
                document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

            const password =
                document
                .getElementById("password")
                .value;

            const confirmPassword =
                document
                .getElementById("confirmPassword")
                .value;


            // =====================================
            // VALIDATION
            // =====================================

            if (!name) {

                message.textContent =
                    "Please enter your full name.";

                message.style.color =
                    "red";

                return;
            }


            if (name.length < 2) {

                message.textContent =
                    "Please enter a valid full name.";

                message.style.color =
                    "red";

                return;
            }


            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                message.style.color =
                    "red";

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    "Password must be at least 6 characters.";

                message.style.color =
                    "red";

                return;
            }


            // =====================================
            // LOADING
            // =====================================

            signupBtn.disabled = true;

            signupBtn.textContent =
                "Creating account...";

            message.textContent = "";


            try {

                // =================================
                // CREATE FIREBASE ACCOUNT
                // =================================

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                // =================================
                // SAVE FULL NAME IN FIREBASE AUTH
                // =================================

                await updateProfile(
                    user,
                    {
                        displayName: name
                    }
                );


                // =================================
                // SAVE USER IN FIRESTORE
                // =================================

                await setDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    ),
                    {

                        uid:
                            user.uid,

                        name:
                            name,

                        email:
                            email,

                        createdAt:
                            serverTimestamp()

                    }
                );


                // =================================
                // SUCCESS
                // =================================

                message.textContent =
                    "Account created successfully!";

                message.style.color =
                    "green";


                signupBtn.textContent =
                    "Account Created ✓";


                // =================================
                // REDIRECT TO LOGIN
                // =================================

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1200
                );

            }


            catch (error) {

                console.error(
                    "Signup error:",
                    error
                );


                let errorMessage =
                    "Could not create your account.";


                // =================================
                // FIREBASE ERROR HANDLING
                // =================================

                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    errorMessage =
                        "This email is already registered.";

                }


                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage =
                        "Please enter a valid email address.";

                }


                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    errorMessage =
                        "Password is too weak. Use at least 6 characters.";

                }


                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    errorMessage =
                        "Network error. Check your internet.";

                }


                else if (
                    error.code ===
                    "permission-denied"
                ) {

                    errorMessage =
                        "Account created, but user data could not be saved. Check Firestore Rules.";

                }


                else if (
                    error.code ===
                    "auth/operation-not-allowed"
                ) {

                    errorMessage =
                        "Email/password sign-up is not enabled in Firebase Authentication.";

                }


                message.textContent =
                    errorMessage;

                message.style.color =
                    "red";


                signupBtn.disabled =
                    false;

                signupBtn.textContent =
                    "Create Account";

            }

        }
    );

</script>

</body>
</html>
