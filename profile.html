<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile - BH Skills Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#1f2937;
}

/* HEADER */
header{
    background:#0f172a;
    color:white;
    padding:18px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#38bdf8;
}

.back-btn{
    color:white;
    text-decoration:none;
    font-size:15px;
}

/* MAIN */
.container{
    width:90%;
    max-width:1100px;
    margin:35px auto;
}

/* PROFILE CARD */
.profile-card{
    background:white;
    border-radius:18px;
    padding:30px;
    display:flex;
    align-items:center;
    gap:25px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    margin-bottom:30px;
}

.avatar{
    width:95px;
    height:95px;
    border-radius:50%;
    background:#0ea5e9;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
}

.profile-info h1{
    font-size:28px;
    margin-bottom:8px;
}

.profile-info p{
    color:#64748b;
    margin-bottom:5px;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.stat-card h2{
    color:#0ea5e9;
    font-size:30px;
    margin-bottom:5px;
}

.stat-card p{
    color:#64748b;
}

/* COURSES */
.section-title{
    font-size:24px;
    margin-bottom:20px;
}

.course-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.course-card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.course-card h3{
    margin-bottom:10px;
}

.course-card p{
    color:#64748b;
    margin-bottom:15px;
}

.progress-container{
    width:100%;
    height:10px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#0ea5e9;
    border-radius:20px;
    transition:0.4s;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:14px;
}

.status{
    margin-top:12px;
    font-size:14px;
    font-weight:bold;
}

/* BUTTONS */
.actions{
    margin-top:30px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:13px 22px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    text-decoration:none;
    display:inline-block;
}

.dashboard-btn{
    background:#0ea5e9;
    color:white;
}

.logout-btn{
    background:#ef4444;
    color:white;
}

/* LOADING */
.loading{
    text-align:center;
    padding:50px;
    color:#64748b;
}

/* MOBILE */
@media(max-width:700px){

    header{
        padding:16px 5%;
    }

    .logo{
        font-size:20px;
    }

    .container{
        width:92%;
        margin:25px auto;
    }

    .profile-card{
        flex-direction:column;
        text-align:center;
        padding:25px 15px;
    }

    .profile-info h1{
        font-size:24px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .course-list{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
        text-align:center;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        BH <span>SKILLS HUB</span>
    </div>

    <a href="dashboard.html" class="back-btn">
        ← Dashboard
    </a>

</header>


<main class="container">

    <!-- PROFILE -->
    <div class="profile-card">

        <div class="avatar" id="avatar">
            ?
        </div>

        <div class="profile-info">

            <h1 id="studentName">
                Loading...
            </h1>

            <p id="studentEmail">
                Loading email...
            </p>

            <p>
                🎓 BH Skills Hub Student
            </p>

        </div>

    </div>


    <!-- STATS -->
    <div class="stats">

        <div class="stat-card">
            <h2 id="totalCourses">0</h2>
            <p>My Courses</p>
        </div>

        <div class="stat-card">
            <h2 id="completedCourses">0</h2>
            <p>Completed</p>
        </div>

        <div class="stat-card">
            <h2 id="averageProgress">0%</h2>
            <p>Average Progress</p>
        </div>

    </div>


    <!-- COURSES -->
    <h2 class="section-title">
        📚 My Learning
    </h2>

    <div id="courseList" class="course-list">

        <div class="loading">
            Loading your courses...
        </div>

    </div>


    <!-- ACTIONS -->
    <div class="actions">

        <a href="dashboard.html" class="btn dashboard-btn">
            📊 Go to Dashboard
        </a>

        <button id="logoutBtn" class="btn logout-btn">
            🚪 Logout
        </button>

    </div>

</main>


<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "YOUR_PROJECT.firebaseapp.com",

    projectId: "YOUR_PROJECT_ID",

    storageBucket: "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

    appId: "YOUR_APP_ID"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================
   HTML ELEMENTS
========================================= */

const studentName =
    document.getElementById("studentName");

const studentEmail =
    document.getElementById("studentEmail");

const avatar =
    document.getElementById("avatar");

const courseList =
    document.getElementById("courseList");

const totalCourses =
    document.getElementById("totalCourses");

const completedCourses =
    document.getElementById("completedCourses");

const averageProgress =
    document.getElementById("averageProgress");

const logoutBtn =
    document.getElementById("logoutBtn");


/* =========================================
   AUTH CHECK
========================================= */

onAuthStateChanged(auth, async (user) => {

    if(!user){

        window.location.href = "login.html";

        return;
    }


    /* USER NAME */

    let name = user.displayName;

    if(!name || name.trim() === ""){

        name = user.email
            ? user.email.split("@")[0]
            : "Student";

    }


    studentName.textContent = name;

    studentEmail.textContent =
        user.email || "No email";


    /* AVATAR */

    avatar.textContent =
        name.charAt(0).toUpperCase();


    /* LOAD COURSES */

    await loadCourses(user.uid);

});


/* =========================================
   LOAD COURSES
========================================= */

async function loadCourses(uid){

    try{

        /*
          Firestore structure expected:

          courses
             |
             |-- document
                    userId
                    courseId
                    courseName
                    progress
                    completed
        */


        const coursesRef =
            collection(db, "courses");


        const q =
            query(
                coursesRef,
                where("userId", "==", uid)
            );


        const snapshot =
            await getDocs(q);


        courseList.innerHTML = "";


        let total = 0;

        let completed = 0;

        let progressTotal = 0;


        snapshot.forEach((doc) => {

            const data = doc.data();


            const courseName =
                data.courseName ||
                data.name ||
                "Course";


            let progress =
                Number(data.progress) || 0;


            /* Keep progress between 0 and 100 */

            if(progress < 0) progress = 0;

            if(progress > 100) progress = 100;


            const isCompleted =
                data.completed === true ||
                progress >= 100;


            total++;

            progressTotal += progress;


            if(isCompleted){

                completed++;

            }


            /* COURSE CARD */

            const card =
                document.createElement("div");

            card.className =
                "course-card";


            card.innerHTML = `

                <h3>📘 ${courseName}</h3>

                <p>
                    Your learning progress
                </p>

                <div class="progress-container">

                    <div
                        class="progress-bar"
                        style="width:${progress}%">
                    </div>

                </div>

                <div class="progress-text">

                    <span>Progress</span>

                    <strong>${progress}%</strong>

                </div>

                <div class="status">

                    ${
                        isCompleted
                        ? "✅ Completed"
                        : "📖 In Progress"
                    }

                </div>

            `;


            courseList.appendChild(card);

        });


        /* NO COURSES */

        if(total === 0){

            courseList.innerHTML = `

                <div class="loading">

                    <h3>No courses found yet.</h3>

                    <p>
                        Start learning to see your progress here.
                    </p>

                </div>

            `;

        }


        /* STATS */

        totalCourses.textContent =
            total;


        completedCourses.textContent =
            completed;


        const average =
            total > 0
            ? Math.round(progressTotal / total)
            : 0;


        averageProgress.textContent =
            average + "%";


    }

    catch(error){

        console.error(
            "Error loading courses:",
            error
        );


        courseList.innerHTML = `

            <div class="loading">

                <p>
                    ⚠️ Unable to load your courses.
                </p>

                <p>
                    Please check your Firebase configuration.
                </p>

            </div>

        `;

    }

}


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

            window.location.href =
                "login.html";

        }

        catch(error){

            console.error(
                "Logout error:",
                error
            );

            alert(
                "Unable to logout. Please try again."
            );

        }

    }
);

</script>

</body>
</html>
