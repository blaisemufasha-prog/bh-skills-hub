<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BH Skills Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px 25px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
            color: #667085;
        }

        .signup a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667085;
            text-decoration: none;
            font-size: 14px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        BH <span>Skills Hub</span>
    </div>

    <p class="subtitle">
        Welcome back! Login to continue.
    </p>

    <form id="loginForm">

        <div class="form-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <a href="#" class="forgot" id="forgotPassword">
            Forgot Password?
        </a>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="signup">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyB589OXINetS1PMr2i8SSU6YRZ-khF3nj8",
    authDomain: "bh-skills-hub.firebaseapp.com",
    projectId: "bh-skills-hub",
    storageBucket: "bh-skills-hub.firebasestorage.app",
    messagingSenderId: "503359590632",
    appId: "1:503359590632:web:5b81f57e402addaf2bb95d"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");
const forgotPassword = document.getElementById("forgotPassword");


/* =========================
   LOGIN
========================= */

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";
    message.textContent = "";

    try {

        const userCredential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        const user = userCredential.user;

        message.textContent =
            "Login successful! Welcome back.";

        message.style.color = "green";

        setTimeout(function() {
            window.location.href = "index.html";
        }, 1000);

    }

    catch (error) {

        console.error(error);

        let errorMessage =
            "Login failed. Please try again.";

        if (
            error.code === "auth/invalid-credential"
        ) {
            errorMessage =
                "Incorrect email or password.";
        }

        else if (
            error.code === "auth/user-not-found"
        ) {
            errorMessage =
                "No account found with this email.";
        }

        else if (
            error.code === "auth/wrong-password"
        ) {
            errorMessage =
                "Incorrect password.";
        }

        else if (
            error.code === "auth/invalid-email"
        ) {
            errorMessage =
                "Please enter a valid email.";
        }

        else if (
            error.code === "auth/too-many-requests"
        ) {
            errorMessage =
                "Too many attempts. Try again later.";
        }

        else if (
            error.code === "auth/network-request-failed"
        ) {
            errorMessage =
                "Network error. Check your internet.";
        }

        message.textContent = errorMessage;
        message.style.color = "red";

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }

});


/* =========================
   FORGOT PASSWORD
========================= */

forgotPassword.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {

            message.textContent =
                "Enter your email first.";

            message.style.color = "red";

            emailInput.focus();

            return;
        }

        try {

            await sendPasswordResetEmail(
                auth,
                email
            );

            message.textContent =
                "Password reset email sent. Check your inbox.";

            message.style.color = "green";

        }

        catch (error) {

            console.error(error);

            let errorMessage =
                "Could not send password reset email.";

            if (
                error.code === "auth/invalid-email"
            ) {
                errorMessage =
                    "Please enter a valid email.";
            }

            message.textContent = errorMessage;
            message.style.color = "red";
        }

    }
);

</script>

</body>
</html>
