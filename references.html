<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>References Manager - BH Skills Hub</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#1e293b;
}

header{
    background:#0f172a;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.header-btn{
    color:white;
    text-decoration:none;
    background:#2563eb;
    padding:9px 14px;
    border-radius:8px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.project-card,
.form-card,
.references-card{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.project-card h1{
    margin-bottom:8px;
    color:#0f172a;
}

.project-meta{
    color:#64748b;
    font-size:14px;
}

.form-card h2,
.references-card h2{
    margin-bottom:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    font-size:14px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#2563eb;
}

.add-btn{
    margin-top:16px;
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn:hover{
    background:#1d4ed8;
}

.reference{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    padding:16px;
    border-radius:10px;
    margin-bottom:12px;
}

.reference-number{
    font-weight:bold;
    color:#2563eb;
    margin-bottom:8px;
}

.reference-text{
    line-height:1.8;
    margin-bottom:12px;
}

.reference-style{
    display:inline-block;
    background:#dbeafe;
    color:#1e40af;
    padding:5px 9px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
}

.reference-actions{
    display:flex;
    gap:8px;
}

.delete-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
}

.edit-btn{
    background:#f59e0b;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:35px 15px;
    color:#64748b;
}

.status{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:8px;
    font-size:14px;
}

.status.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.status.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.status.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
}

.loading{
    text-align:center;
    padding:30px;
    color:#64748b;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .reference-actions{
        flex-direction:column;
    }

    .edit-btn,
    .delete-btn{
        width:100%;
    }
}
</style></head><body><header><div class="logo">
    BH Skills Hub
</div>

<a
    href="chapter-builder.html"
    class="header-btn"
>
    ← Builder
</a>

</header><div class="container"><!-- PROJECT -->

<div class="project-card">

    <h1 id="projectTitle">
        References Manager
    </h1>

    <p
        class="project-meta"
        id="projectMeta"
    >
        Loading project...
    </p>

</div>


<!-- ADD REFERENCE -->

<div class="form-card">

    <h2>➕ Add Reference</h2>

    <div class="form-grid">

        <div class="form-group">

            <label for="author">
                Author *
            </label>

            <input
                type="text"
                id="author"
                placeholder="e.g. Smith, J."
            >

        </div>


        <div class="form-group">

            <label for="year">
                Year *
            </label>

            <input
                type="number"
                id="year"
                placeholder="e.g. 2025"
            >

        </div>


        <div class="form-group full">

            <label for="title">
                Book / Article Title *
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter title"
            >

        </div>


        <div class="form-group">

            <label for="publisher">
                Publisher / Journal
            </label>

            <input
                type="text"
                id="publisher"
                placeholder="Publisher or Journal"
            >

        </div>


        <div class="form-group">

            <label for="doi">
                DOI / URL
            </label>

            <input
                type="text"
                id="doi"
                placeholder="https://... or DOI"
            >

        </div>


        <div class="form-group full">

            <label for="style">
                Citation Style
            </label>

            <select id="style">

                <option value="APA">
                    APA
                </option>

                <option value="MLA">
                    MLA
                </option>

                <option value="Chicago">
                    Chicago
                </option>

                <option value="IEEE">
                    IEEE
                </option>

                <option value="Harvard">
                    Harvard
                </option>

            </select>

        </div>

    </div>


    <button
        class="add-btn"
        id="saveBtn"
        onclick="addReference()"
    >
        + Add Reference
    </button>


    <div
        id="status"
        class="status"
    ></div>

</div>


<!-- REFERENCES -->

<div class="references-card">

    <h2>
        📚 Project References
    </h2>

    <div id="referencesList">

        <div class="loading">
            Loading references...
        </div>

    </div>

</div>

</div><script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyB589OXINetS1PMr2i8SSU6YRZ-khF3nj8",

    authDomain:
        "bh-skills-hub.firebaseapp.com",

    projectId:
        "bh-skills-hub",

    storageBucket:
        "bh-skills-hub.firebasestorage.app",

    messagingSenderId:
        "503359590632",

    appId:
        "1:503359590632:web:5b81f57e402addaf2bb95d6"

};


/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let project = null;

let projectId = null;

let references = [];

let editingId = null;


/* =========================
   GET LOCAL PROJECT
========================= */

const savedProject =
    localStorage.getItem(
        "bhAcademicProject"
    );


if(!savedProject){

    window.location.href =
        "book-builder.html";

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async (user)=>{

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser = user;


        try{

            const localProject =
                JSON.parse(
                    savedProject
                );


            projectId =
                localProject.id;


            if(!projectId){

                throw new Error(
                    "Project ID not found."
                );

            }


            const projectRef =
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    "projects",
                    projectId
                );


            const snapshot =
                await getDoc(
                    projectRef
                );


            if(snapshot.exists()){

                project =
                    snapshot.data();

            }else{

                project =
                    localProject;

            }


            references =
                Array.isArray(
                    project.references
                )
                ? project.references
                : [];


            loadProject();

        }
        catch(error){

            console.error(error);

            showStatus(
                "Failed to load project: "
                + error.message,
                "error"
            );

        }

    }
);


/* =========================
   LOAD PROJECT
========================= */

function loadProject(){

    document.getElementById(
        "projectTitle"
    ).textContent =
        project.title ||
        "Academic Project";


    document.getElementById(
        "projectMeta"
    ).textContent =
        `${project.type || "Academic Project"} • ${
            project.author || "Author"
        }`;


    renderReferences();

}


/* =========================
   ADD / UPDATE
========================= */

window.addReference =
async function(){

    const author =
        document.getElementById(
            "author"
        ).value.trim();


    const year =
        document.getElementById(
            "year"
        ).value.trim();


    const title =
        document.getElementById(
            "title"
        ).value.trim();


    const publisher =
        document.getElementById(
            "publisher"
        ).value.trim();


    const doi =
        document.getElementById(
            "doi"
        ).value.trim();


    const style =
        document.getElementById(
            "style"
        ).value;


    /* VALIDATION */

    if(!author){

        showStatus(
            "Please enter the author.",
            "error"
        );

        return;

    }


    if(!year){

        showStatus(
            "Please enter the year.",
            "error"
        );

        return;

    }


    if(!title){

        showStatus(
            "Please enter the title.",
            "error"
        );

        return;

    }


    /* EDIT */

    if(editingId){

        const index =
            references.findIndex(
                ref =>
                    ref.id === editingId
            );


        if(index !== -1){

            references[index] = {

                ...references[index],

                author,

                year,

                title,

                publisher,

                doi,

                style

            };

        }


        editingId = null;


        document.getElementById(
            "saveBtn"
        ).textContent =
            "+ Add Reference";


    }

    /* NEW */

    else{

        references.push({

            id:
                "ref_" +
                Date.now(),

            author,

            year,

            title,

            publisher,

            doi,

            style,

            createdAt:
                new Date().toISOString()

        });

    }


    await saveReferences();

    clearForm();

    renderReferences();

};


/* =========================
   SAVE FIRESTORE
========================= */

async function saveReferences(){

    if(!currentUser){

        return;

    }


    try{

        showStatus(
            "Saving to Firestore...",
            "info"
        );


        const projectRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "projects",
                projectId
            );


        await setDoc(

            projectRef,

            {

                references:
                    references,

                updatedAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );


        project.references =
            references;


        saveLocalProject();


        showStatus(
            "✓ Saved successfully to Firestore.",
            "success"
        );


    }
    catch(error){

        console.error(error);

        showStatus(
            "Firestore error: "
            + error.message,
            "error"
        );

    }

}


/* =========================
   EDIT REFERENCE
========================= */

window.editReference =
function(id){

    const reference =
        references.find(
            ref =>
                ref.id === id
        );


    if(!reference){

        return;

    }


    document.getElementById(
        "author"
    ).value =
        reference.author || "";


    document.getElementById(
        "year"
    ).value =
        reference.year || "";


    document.getElementById(
        "title"
    ).value =
        reference.title || "";


    document.getElementById(
        "publisher"
    ).value =
        reference.publisher || "";


    document.getElementById(
        "doi"
    ).value =
        reference.doi || "";


    document.getElementById(
        "style"
    ).value =
        reference.style || "APA";


    editingId = id;


    document.getElementById(
        "saveBtn"
    ).textContent =
        "💾 Update Reference";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* =========================
   DELETE REFERENCE
========================= */

window.deleteReference =
async function(id){

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this reference?"
        );


    if(!confirmDelete){

        return;

    }


    references =
        references.filter(
            ref =>
                ref.id !== id
        );


    await saveReferences();

    renderReferences();

};


/* =========================
   RENDER
========================= */

function renderReferences(){

    const list =
        document.getElementById(
            "referencesList"
        );


    if(!references.length){

        list.innerHTML = `

            <div class="empty">

                📚 No references yet.

                <br><br>

                Add your first reference above.

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    references.forEach(
        (reference,index)=>{

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "reference";


            item.innerHTML = `

                <div class="reference-number">

                    Reference ${index + 1}

                </div>


                <div class="reference-style">

                    ${escapeHTML(
                        reference.style || "APA"
                    )}

                </div>


                <div class="reference-text">

                    ${formatReference(
                        reference
                    )}

                </div>


                <div class="reference-actions">

                    <button
                        class="edit-btn"
                        onclick="editReference('${reference.id}')"
                    >
                        ✏️ Edit
                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteReference('${reference.id}')"
                    >
                        🗑 Delete
                    </button>

                </div>

            `;


            list.appendChild(item);

        }
    );

}


/* =========================
   FORMAT REFERENCES
========================= */

function formatReference(ref){

    const author =
        escapeHTML(
            ref.author || ""
        );


    const year =
        escapeHTML(
            ref.year || ""
        );


    const title =
        escapeHTML(
            ref.title || ""
        );


    const publisher =
        escapeHTML(
            ref.publisher || ""
        );


    const doi =
        escapeHTML(
            ref.doi || ""
        );


    if(ref.style === "APA"){

        return `
            ${author} (${year}).
            <i>${title}</i>.
            ${publisher}
            ${doi ? ". " + doi : ""}
        `;

    }


    if(ref.style === "MLA"){

        return `
            ${author}.
            <i>${title}</i>.
            ${publisher},
            ${year}.
            ${doi || ""}
        `;

    }


    if(ref.style === "Chicago"){

        return `
            ${author}.
            <i>${title}</i>.
            ${publisher},
            ${year}.
            ${doi || ""}
        `;

    }


    if(ref.style === "IEEE"){

        return `
            ${author},
            "${title},"
            ${publisher},
            ${year}.
            ${doi || ""}
        `;

    }


    if(ref.style === "Harvard"){

        return `
            ${author} ${year},
            <i>${title}</i>,
            ${publisher}.
            ${doi || ""}
        `;

    }


    return `
        ${author} (${year}).
        ${title}.
        ${publisher}.
        ${doi}
    `;

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

    document.getElementById(
        "author"
    ).value = "";


    document.getElementById(
        "year"
    ).value = "";


    document.getElementById(
        "title"
    ).value = "";


    document.getElementById(
        "publisher"
    ).value = "";


    document.getElementById(
        "doi"
    ).value = "";


    document.getElementById(
        "style"
    ).value = "APA";


    editingId = null;


    document.getElementById(
        "saveBtn"
    ).textContent =
        "+ Add Reference";

}


/* =========================
   LOCAL STORAGE
========================= */

function saveLocalProject(){

    const localCopy = {

        ...project,

        references:
            references,

        createdAt:null,

        updatedAt:null

    };


    localStorage.setItem(
        "bhAcademicProject",
        JSON.stringify(
            localCopy
        )
    );

}


/* =========================
   STATUS
========================= */

function showStatus(
    message,
    type
){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        "status " + type;


    if(type === "info"){

        setTimeout(
            ()=>{
                status.className =
                    "status";
            },
            2500
        );

    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script></body>
</html>
